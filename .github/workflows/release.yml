name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to package when dispatching manually (for example 0.1.2)"
        required: true
        default: "0.1.2"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile desktop package
        run: python -m compileall desktop_app

      - name: Run test suite (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: python -m pytest -q -p no:cacheprovider

      - name: Build Windows 10/11 x64 artifacts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:DISPATCH_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          ./packaging/build_windows.ps1 -Version $version

      - name: Run packaged application smoke test
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:DISPATCH_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          python packaging/smoke_test.py --exe dist/VideoDownloader-windows-x64.exe --expected-version $version

      - name: Run packaged GUI launch probe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          python packaging/gui_probe.py --exe dist/VideoDownloader-windows-x64/VideoDownloader-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/gui_probe.py --exe dist/VideoDownloader-windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Video Downloader ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          body: |
            Windows 10/11 x64 portable release.

            This initial release is unsigned; Windows SmartScreen may display a warning.
          fail_on_unmatched_files: true
          files: |
            dist/VideoDownloader-windows-x64.zip
            dist/VideoDownloader-windows-x64.exe
            dist/SHA256SUMS.txt
