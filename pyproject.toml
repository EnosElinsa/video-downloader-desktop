[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "0.1.2"
description = "Universal video downloader with CLI and Windows desktop interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.2.1",
    "requests>=2.25.0",
    "yt-dlp>=2023.3.4",
]

[project.scripts]
video-downloader = "desktop_app.cli:main"
video-downloader-gui = "desktop_app.main:main"
video-downloader-batch = "desktop_app.batch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
