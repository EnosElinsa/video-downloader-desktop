[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "0.1.0"
description = "Universal video downloader with CLI and Windows desktop interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.25.0",
    "yt-dlp>=2023.3.4",
]

[project.scripts]
video-downloader = "universal_video_downloader:main"
# Task 5 will switch this launcher to desktop_app.main:main.
video-downloader-gui = "video_downloader_gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
